modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# The mod is intentionally optional on either side. Its only server component is optional zone policy sync.
displayTest="IGNORE_ALL_VERSION"
description='''
Client-side autumn vegetation rendering with broad vanilla/mod compatibility, smooth coordinate zones, and optional server-authoritative zone configuration.
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
